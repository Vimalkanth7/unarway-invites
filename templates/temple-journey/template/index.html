<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Reception Invitation</title>
<!--
  No og/twitter meta here: this document only ever runs inside a sandboxed
  preview iframe or gets packaged into the paid download. The public share
  page is /i/<short-id> (Phase 5/6), which owns its own social meta tags.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Kavivanar&amp;family=Manrope:wght@400;500;600&amp;family=Marcellus&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0406}
a{color:#F7E2A8}a:hover{color:#FFFFFF}
.inv3{--vh:900px;--night:#0D0406;--wine:#3A0A12;--gold:#E3B75C;--gold-hi:#F7E2A8;--ivory:#F8EEDC;--ivory2:#E4D6BE;--kum:#C4252F;font-family:Manrope,'Segoe UI',sans-serif;color:var(--ivory);background:var(--night);position:relative;overflow-x:clip}
.inv3 *{box-sizing:border-box}
.dis{font-family:Gloock,'Didot','Times New Roman',serif;font-weight:400}
.tam{font-family:Kavivanar,'Noto Sans Tamil','Latha',serif}
.lab{font-family:Marcellus,'Times New Roman',serif;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
.gl{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:0}
.inv3.gl-on .gl{display:block}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;display:none;background:radial-gradient(120% 90% at 50% 50%,rgba(13,4,6,0) 55%,rgba(13,4,6,.75) 100%)}
.inv3.gl-on .vig{display:block}
.veil{position:fixed;inset:0;z-index:90;background:#0D0406;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.inv3.gl-on .veil{display:flex}
.veil .tam{font-size:64px;color:#E3B75C;line-height:1}
.prog{position:fixed;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#8A5A1C,#F7E2A8);z-index:80;display:none}
.inv3.gl-on .prog{display:block}
.story{position:relative;z-index:2}
.s{position:relative}
.stick{position:relative;min-height:clamp(640px,100vh,980px);display:flex;flex-direction:column}
.inv3.gl-on .stick{position:sticky;top:0;height:var(--vh);min-height:0}
.inv3.gl-on .s-hero{height:calc(var(--vh) * 1.8)}
.inv3.gl-on .s-walk{height:calc(var(--vh) * 4)}
.inv3.gl-on .s-date{height:calc(var(--vh) * 2.2)}
.inv3.gl-on .s-relics{height:calc(var(--vh) * 2.2)}
.inv3.gl-on .s-couple{height:calc(var(--vh) * 1.9)}
.inv3.gl-on .fb{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;border:1px solid #E3B75C;color:#F8EEDC;text-decoration:none;font-family:Marcellus,serif;font-size:13px;letter-spacing:.24em;text-transform:uppercase;background:rgba(13,4,6,.55);cursor:pointer;backdrop-filter:blur(6px);transition:background .3s,color .3s}
.btn:hover{background:#E3B75C;color:#1A0709}
.btn.gold{background:linear-gradient(180deg,#F7E2A8,#E3B75C 55%,#B4832F);color:#1A0709;border-color:#F7E2A8}
.btn.gold:hover{filter:brightness(1.06);color:#1A0709}
.btn svg{width:18px;height:18px}
.glass{background:linear-gradient(180deg,rgba(26,7,9,.72),rgba(13,4,6,.82));border:1px solid rgba(227,183,92,.38);border-radius:26px;backdrop-filter:blur(10px);box-shadow:0 40px 80px rgba(0,0,0,.45)}
.mask{display:block;overflow:hidden;padding-bottom:.08em}
.mask > span{display:inline-block}
.rule{display:flex;align-items:center;gap:12px;color:#E3B75C}
.rule i{display:block;width:54px;height:1px;background:currentColor;opacity:.7}
.rule b{display:block;width:7px;height:7px;transform:rotate(45deg);border:1px solid currentColor}

/* hero */
.s-hero .stick{align-items:center;justify-content:space-between;padding:22px 24px 0;text-align:center}
.hero-top{width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.hero-top .tam{font-size:22px;color:#F7E2A8}
.hero-top .ht-om{font-size:30px;line-height:1;color:#E3B75C}
.hero-bottom{width:calc(100% + 48px);margin:0 -24px;padding:70px 20px 26px;background:linear-gradient(180deg,rgba(13,4,6,0),rgba(13,4,6,.86) 46%,#0D0406)}
.medal{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 35% 30%,#4A0E18,#1A0709 70%);box-shadow:0 0 0 1px #E3B75C,0 0 0 6px rgba(13,4,6,.9),0 0 0 7px rgba(227,183,92,.45),0 0 40px rgba(227,183,92,.35)}
.medal .tam{font-size:34px;color:#F7E2A8;line-height:1;transform:translateY(3px)}
.hb-ta{font-size:clamp(30px,4.6vw,46px);line-height:1.1;color:#F7E2A8;text-shadow:0 0 30px rgba(227,183,92,.35)}
.hb-sub{font-size:clamp(17px,2vw,21px);color:#E4D6BE;font-family:Gloock,serif;max-width:520px;line-height:1.35}
.hero-arch{position:relative;width:min(300px,64vw);aspect-ratio:9/16;margin:24px auto;border-radius:999px 999px 18px 18px;overflow:hidden;box-shadow:0 0 0 2px #E3B75C,0 0 0 10px rgba(13,4,6,.8),0 0 0 11px rgba(227,183,92,.5),0 40px 90px rgba(0,0,0,.6)}
.hero-arch video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.inv3.gl-on .hero-arch{position:fixed;left:0;bottom:0;width:6px;margin:0;opacity:.01;pointer-events:none;z-index:0;box-shadow:none}
.hero-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;color:#E4D6BE}
.cue{width:1px;height:54px;background:linear-gradient(#E3B75C,rgba(227,183,92,0));transform-origin:50% 0}

/* walk captions */
.s-walk .stick{justify-content:flex-end;align-items:center;text-align:center;padding:0 20px 9vh}
.inv3:not(.gl-on) .s-walk .stick{justify-content:center;gap:60px;padding:120px 20px;background:linear-gradient(rgba(13,4,6,.55),rgba(13,4,6,.85)),url(assets/d5fa5812bd.jpg) center/cover}
.capstage{position:relative;width:min(900px,100%);display:grid}
.inv3:not(.gl-on) .capstage{display:flex;flex-direction:column;gap:56px}
.cap{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 20px;border-radius:30px;background:radial-gradient(closest-side,rgba(13,4,6,.72),rgba(13,4,6,0))}
.cap h1{margin:0;font-family:Gloock,serif;font-weight:400;font-size:clamp(52px,8.4vw,128px);line-height:.95;color:#F8EEDC}
.cap h1 em{font-style:normal;color:#E3B75C;font-size:.55em;display:block;margin:6px 0}
.cap .tn{font-size:clamp(20px,2.6vw,28px);color:#F7E2A8}
.cap .big-ta{font-size:clamp(46px,7.4vw,104px);line-height:1.15;color:#F7E2A8}
.cap p{margin:0;font-size:clamp(17px,1.8vw,20px);color:#E4D6BE;max-width:560px;line-height:1.55}

/* date */
.s-date .stick{align-items:center;justify-content:center;padding:40px 20px;text-align:center;gap:22px}
.inv3:not(.gl-on) .s-date .stick{background:radial-gradient(70% 60% at 50% 100%,#5A1220,#0D0406 70%)}
.date-h{margin:0;font-family:Gloock,serif;font-weight:400;font-size:clamp(40px,6vw,80px);line-height:1}
.scard{position:relative;width:min(520px,92vw);aspect-ratio:16/10;border-radius:24px;overflow:hidden;background:radial-gradient(90% 100% at 50% 0%,#6B1424,#1F0609 75%);border:1px solid rgba(247,226,168,.55);box-shadow:inset 0 0 0 8px rgba(13,4,6,.55),inset 0 0 0 9px rgba(227,183,92,.45),0 40px 90px rgba(0,0,0,.55)}
.sc-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sc-wd{font-family:Marcellus,serif;letter-spacing:.34em;text-transform:uppercase;font-size:13px;color:#E3B75C}
.sc-day{font-family:Gloock,serif;font-size:clamp(84px,18vw,150px);line-height:.95;color:#F7E2A8}
.sc-my{font-family:Marcellus,serif;letter-spacing:.3em;text-transform:uppercase;font-size:clamp(14px,2.6vw,20px)}
.sc-ta{font-size:16px;color:#F7E2A8;margin-top:4px}
.sc-time{font-size:16px;color:#E4D6BE;margin-top:2px}
.scv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:3;display:block}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4;pointer-events:none}
.burst i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:80% 0 80% 0;opacity:0}
.cd{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cd div{min-width:74px;padding:12px 8px;border-radius:14px;border:1px solid rgba(227,183,92,.45);background:rgba(13,4,6,.6);display:flex;flex-direction:column;align-items:center;gap:4px}
.cd b{font-family:Gloock,serif;font-weight:400;font-size:30px;color:#F7E2A8;line-height:1}
.cd span{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#E3B75C}
.linkish{background:none;border:0;color:#F7E2A8;font-family:Marcellus,serif;font-size:12px;letter-spacing:.26em;text-transform:uppercase;cursor:pointer;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:6px}

/* relics */
.s-relics .stick{justify-content:center;padding:40px 6vw}
.inv3:not(.gl-on) .s-relics .stick{background:radial-gradient(60% 60% at 70% 50%,#3A0A12,#0D0406 70%)}
.relic-copy{position:relative;width:min(470px,100%);display:grid}
.inv3:not(.gl-on) .relic-copy{display:flex;flex-direction:column;gap:30px}
.rc{grid-area:1/1;padding:34px 32px;display:flex;flex-direction:column;gap:14px}
.rc h2{margin:0;font-family:Gloock,serif;font-weight:400;font-size:clamp(38px,4.6vw,62px);line-height:1}
.rc p{margin:0;font-size:18px;line-height:1.6;color:#E4D6BE}
.rc .tam{font-size:22px;color:#F7E2A8}

/* couple */
.s-couple .stick{justify-content:center;align-items:flex-end;padding:40px 6vw}
.inv3:not(.gl-on) .s-couple .stick{align-items:center;background:linear-gradient(rgba(13,4,6,.6),rgba(13,4,6,.9)),url(assets/4e2b763272.webp) center 30%/min(900px,120%) no-repeat,#0D0406}
.cp-card{width:min(460px,100%);padding:28px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.cp-photo{position:relative;width:min(220px,56vw);aspect-ratio:3/4;border-radius:999px 999px 16px 16px;overflow:hidden;box-shadow:0 0 0 2px #E3B75C,0 0 0 9px rgba(13,4,6,.7),0 0 0 10px rgba(227,183,92,.45)}
.cp-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cp-names{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;width:100%}
.cp-names h3{margin:6px 0 2px;font-family:Gloock,serif;font-weight:400;font-size:32px;line-height:1}
.cp-names .tam{color:#F7E2A8;font-size:18px}
.cp-names p{margin:6px 0 0;font-size:15px;color:#E4D6BE;line-height:1.45}

/* venue */
.s-venue{padding:16vh 0 12vh}
.vwrap{max-width:1120px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:40px;align-items:center}
.v-arch{position:relative;width:min(340px,80vw);aspect-ratio:9/14;margin:0 auto;border-radius:999px 999px 20px 20px;overflow:hidden;box-shadow:0 0 0 2px #E3B75C,0 0 0 11px rgba(13,4,6,.7),0 0 0 12px rgba(227,183,92,.45),0 40px 90px rgba(0,0,0,.6)}
.v-arch video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-info{padding:38px 34px;display:flex;flex-direction:column;gap:22px}
.v-info h2{margin:0;font-family:Gloock,serif;font-weight:400;font-size:clamp(40px,5vw,66px);line-height:1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 26px}
.fld span{display:block;font-family:Marcellus,serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#E3B75C;margin-bottom:6px}
.fld b{display:block;font-family:Gloock,serif;font-weight:400;font-size:24px;line-height:1.2}
.fld small{display:block;font-size:15px;color:#E4D6BE;margin-top:4px;line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:12px}

/* finale */
.s-finale{padding:4vh 0 10vh;text-align:center}
.fin-frame{position:relative;width:min(640px,94vw);aspect-ratio:720/1063;margin:0 auto}
.fin-frame img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:2}
.fin-in{position:absolute;left:16%;right:16%;top:12%;bottom:12%;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 10px;border-radius:12px;background:radial-gradient(closest-side,rgba(26,7,9,.92),rgba(13,4,6,.78))}
.fin-in .tam{font-size:clamp(20px,3.4vw,32px);line-height:1.5;color:#F7E2A8}
.fin-in .dis{font-size:clamp(20px,3vw,30px);line-height:1.2}
.fin-in .acts{justify-content:center}
.fin-in .btn{min-height:46px;padding:0 18px;font-size:11px}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:26px;max-width:820px;margin:40px auto 0;padding:0 20px}
.fam h3{margin:0 0 8px;font-family:Marcellus,serif;font-weight:400;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#E3B75C}
.fam p{margin:0;font-family:Gloock,serif;font-size:22px;line-height:1.4}
.foot{margin-top:50px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#E4D6BE}
/* readable family + closing panels over the temple scene */
.fam,.foot{position:relative;z-index:3;box-sizing:border-box;width:min(820px,calc(100% - 32px));margin-left:auto;margin-right:auto;background:linear-gradient(180deg,rgba(26,7,9,.86),rgba(13,4,6,.92));border:1px solid rgba(227,183,92,.45);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.fam{margin-top:28px;padding:26px 20px;gap:22px}
.fam h3{font-family:Manrope,'Segoe UI',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;color:#F7E2A8}
.fam p{font-size:21px;color:#FFF6E6}
.foot{margin-top:18px;padding:22px 18px 26px}
.foot .lab{font-family:Manrope,'Segoe UI',sans-serif;font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:none;color:#F7E2A8 !important;word-break:break-word}
.foot .dis{color:#FFF6E6;line-height:1.35}

@media (max-width:760px){
  .s-relics .stick{justify-content:flex-end;padding:30px 16px}
  .rc{padding:24px 22px}
  .rc p{font-size:16px}
  .s-couple .stick{align-items:center;justify-content:flex-end;padding:24px 16px}
  .cp-card{padding:20px}
  .cp-photo{width:min(150px,40vw)}
  .fin-in{left:14%;right:14%;top:11%;bottom:11%;gap:10px}
  .fin-in .btn{min-height:44px;padding:0 14px;letter-spacing:.14em}
}
</style>

<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/ScrollTrigger.min.js"></script>
<script src="assets/js/three.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">


<div class="inv3">
<canvas class="gl" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>
<div class="prog" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"><span class="tam">உ</span><span class="lab" style="color: #E4D6BE">Lighting the lamps</span></div>

<div class="story">

<!-- 1 · Pillaiyar Suzhi : Ganesha video doors -->
<section class="s s-hero" aria-label="Opening">
<div class="stick">
  <div class="hero-top">
    <span class="tam ht-om" aria-hidden="true">உ</span>
    <span class="lab" style="font-size: 12px; color: #E3B75C">Wedding Reception</span>
    <span class="tam">திருமண அழைப்பிதழ்</span>
  </div>
  <div class="hero-arch"><video class="vid-g" crossorigin="anonymous" src="assets/5c517b8490.mp4" poster="assets/54d722b725.jpg" muted="" autoplay="" loop="" playsinline="" preload="auto" aria-label="Baby Ganesha writing at the temple"></video></div>
  <div class="hero-bottom">
    <span class="tam hb-ta">சுபாரம்பம்</span>
    <span class="hb-sub">Every auspicious beginning starts with Pillaiyar</span>
    <span class="lab" style="font-size: 10px; color: #E3B75C; margin-top: 6px">Scroll to enter the temple</span>
    <i class="cue" aria-hidden="true"></i>
  </div>
</div>
</section>

<!-- 2 · The walk : corridor of golden pillars -->
<section class="s s-walk" aria-label="The couple's names">
<div class="stick">
  <div class="capstage">
    <div class="cap cap1">
      <div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
      <span class="lab" style="color: #E3B75C">Together with their families</span>
      <p>invite you to walk with us into the evening we celebrate the wedding of</p>
    </div>
    <div class="cap cap2">
      <h1>{{groom}}<em>&amp;</em>{{bride}}</h1>
      <span class="tam tn">{{groomTa}} · {{brideTa}}</span>
    </div>
    <div class="cap cap3">
      <span class="tam big-ta">திருமண வரவேற்பு</span>
      <span class="lab" style="color: #E3B75C">Wedding Reception</span>
    </div>
  </div>
</div>
</section>

<!-- 3 · The date : scratch foil before the gopuram -->
<section class="s s-date" aria-label="Date">
<div class="stick">
  <span class="lab" style="color: #E3B75C">Beneath the gopuram</span>
  <h2 class="date-h">Save the evening</h2>
  <div class="scard">
    <div class="sc-in">
      <span class="sc-wd">{{weekday}}</span>
      <span class="sc-day">{{day}}</span>
      <span class="sc-my">{{monthYear}}</span>
      <span class="tam sc-ta">{{taDate}}</span>
      <span class="sc-time">Reception from {{time}}</span>
    </div>
    <canvas class="scv" aria-label="Gold foil. Scratch it to reveal the date" role="img"></canvas>
    <div class="burst"><sc-for list="{{burst}}" as="b" hint-placeholder-count="8"><i style="background: {{b.c}}"></i></sc-for></div>
  </div>
  <sc-if value="{{notRevealed}}" hint-placeholder-val="{{ true }}"><button class="linkish" type="button" onclick="{{revealNow}}">Or tap to reveal</button></sc-if>
  <div class="cd" aria-label="Countdown to the reception">
    <div><b>{{cd.d}}</b><span>Days</span></div>
    <div><b>{{cd.h}}</b><span>Hours</span></div>
    <div><b>{{cd.m}}</b><span>Min</span></div>
    <div><b>{{cd.s}}</b><span>Sec</span></div>
  </div>
</div>
</section>

<!-- 4 · Thaali & Metti : real 3D gold and silver -->
<section class="s s-relics" aria-label="Thaali and metti">
<div class="stick">
  <div class="relic-copy">
    <div class="rc glass rc1">
      <span class="tam">மாங்கல்யம்</span>
      <h2>The sacred thaali</h2>
      <p>One golden thread, tied once, binding two families for a lifetime. Turn it in the lamplight as you scroll.</p>
    </div>
    <div class="rc glass rc2">
      <span class="tam">மெட்டி</span>
      <h2>A silver promise</h2>
      <p>Slipped on after the seven steps, the metti carries every vow forward, one step at a time.</p>
    </div>
  </div>
</div>
</section>

<!-- 5 · The couple at the mandapam -->
<section class="s s-couple" aria-label="The couple">
<div class="stick">
  <div class="cp-card glass">
    <span class="tam" style="color: #F7E2A8; font-size: 20px">மணமக்கள்</span>
    <div class="cp-photo"><img src="{{couplePhoto}}" alt="Photo of the couple"></div>
    <div class="cp-names">
      <div>
        <span class="lab" style="font-size: 11px; color: #E3B75C">The Groom</span>
        <h3>{{groom}}</h3>
        <span class="tam">{{groomTa}}</span>
        <p>Son of Thiru.&nbsp;{{groomFather}}&nbsp;&amp; <span style="white-space:nowrap">Tmt.&nbsp;{{groomMother}}</span></p>
      </div>
      <div>
        <span class="lab" style="font-size: 11px; color: #E3B75C">The Bride</span>
        <h3>{{bride}}</h3>
        <span class="tam">{{brideTa}}</span>
        <p>Daughter of Thiru.&nbsp;{{brideFather}}&nbsp;&amp; <span style="white-space:nowrap">Tmt.&nbsp;{{brideMother}}</span></p>
      </div>
    </div>
  </div>
</div>
</section>

<!-- 6 · Venue -->
<section class="s s-venue" aria-label="Venue">
<div class="vwrap">

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);

  componentDidMount() {

  componentDidUpdate() {

  // ---------- data ----------
  // All invitation designs are for events in India; a bare "YYYY-MM-DDTHH:mm"
  // (what a datetime-local input gives us) is interpreted as IST so the
  // countdown lands on the same instant for every guest, in any time zone.
  parseEventDate(v) {
    if (!v) return null;
    const hasOffset = /[Zz]$|[+-]\d{2}:?\d{2}$/.test(v);
    const d = new Date(hasOffset ? v : v + '+05:30');
    return isNaN(d.getTime()) ? null : d;
  }

  info() {
    const p = this.props;
    const groom = (p.groomName ?? 'Groom') || 'Groom';
    const bride = (p.brideName ?? 'Bride') || 'Bride';
    const d = this.parseEventDate(p.eventDate) || this.parseEventDate('2027-01-24T18:30');
    const ok = !isNaN(d.getTime());
    const fmt = (o, loc) => { try { return d.toLocaleDateString(loc || 'en-IN', o); } catch (e) { return ''; } };
    let time = '[Time]';
    if (ok) { try { time = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase(); } catch (e) {} }
    return {
      groom, bride, ok, d, time,
      groomTa: p.groomNameTamil ?? 'மணமகன்', brideTa: p.brideNameTamil ?? 'மணமகள்',
      weekday: ok ? fmt({ weekday: 'long' }) : '[Weekday]',
      day: ok ? String(d.getDate()).padStart(2, '0') : '00',
      monthYear: ok ? fmt({ month: 'long', year: 'numeric' }) : '[Month Year]',
      dateLong: ok ? fmt({ day: 'numeric', month: 'long', year: 'numeric' }) : '[Date]',
      taDate: ok ? fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }, 'ta-IN') : ''

  bannerKey() { const i = this.info(); return [i.groom, i.bride, i.groomTa, i.brideTa, i.dateLong, i.time, this.state.revealed].join('|'); }

    const f = (n) => Math.round(n * 10) / 10;
    const rot = (pts, a) => { const c = Math.cos(a), s = Math.sin(a); return pts.map(([x, y]) => [f(x * c - y * s), f(x * s + y * c)]); };

    const PB = [[0, -46], [18, -70], [18, -98], [0, -110], [-18, -98], [-18, -70], [0, -46]];
    const LOBE = [[-40, -150], [-30, -200], [30, -200], [40, -150]];

  frame(t, dt) {
    const G = this._gl, T = G.T, S = G.S;
    const m = G.mouse; m.sx += (m.x - m.sx) * 0.05; m.sy += (m.y - m.sy) * 0.05;
    const IN = G.intro, c = IN.crane, close = Math.min(1, S.door);
    const port = G.cam.aspect < 0.8 ? 3.4 * Math.max(0, Math.min(1, (S.pz - 4) / 8)) : 0;
    G.cp.lerp(new T.Vector3((S.px + m.sx * 0.5) * (1 - c), (S.py - m.sy * 0.3 + Math.sin(t * 0.8) * 0.03) * (1 - c) + 10.5 * c, (S.pz + port) * (1 - c) + 8.6 * c), 0.08);
    G.ct.lerp(new T.Vector3((S.tx + m.sx * 0.8) * (1 - c), (S.ty - m.sy * 0.4) * (1 - c), S.tz * (1 - c) + 5 * c), 0.08);
    G.cam.position.copy(G.cp); G.cam.lookAt(G.ct);
    const bl = IN.bloom * (1 - close * 0.85);
    G.lp.forEach((p) => { const bi = Math.max(0, Math.min(1, bl * 1.35 - p.ri * 0.11)); p.tilt.rotation.x = -0.1 + (p.open + 0.1) * bi + Math.sin(t * 0.8 + p.ph) * 0.02 * bi; });
    G.lift.position.y = -4.1 * (1 - Math.max(0, Math.min(1, IN.rise - close * 1.1)));
    G.lift.rotation.y = Math.sin(t * 0.35) * 0.06;
    G.fd.forEach((f, i) => {
      const on = Math.max(0, Math.min(1, IN.lit * 2.2 - (i % 12) * 0.1));
      f.g.position.y = 0.04 + Math.sin(t * 1.1 + f.ph) * 0.025; f.g.rotation.z = Math.sin(t * 0.9 + f.ph) * 0.05;
      const k2 = 1 + Math.sin(t * (10 + i % 4) + i) * 0.1;
      f.fl.scale.set(0.1 * on * (2 - k2), 0.2 * on * k2, 1); f.gl.material.opacity = 0.42 * on; f.refl.material.opacity = 0.22 * on;
    });
    G.ripples.forEach((rp, i) => { const s = (t * 0.22 + i / 7) % 1; rp.scale.setScalar(0.2 + s * 1.4); rp.material.opacity = (1 - s) * 0.22 * IN.lit; });
    G.pl.forEach((L, i) => { L.intensity = IN.lit * (i === 2 ? 8 : 6 + Math.sin(t * 9 + i) * 0.8); });
    G.lglow.material.opacity = 0.28 * IN.bloom * (1 - close);
    G.pillars.forEach((p) => { p.rotation.y = Math.atan2(G.cp.x - p.position.x, G.cp.z - p.position.z); });
    G.flames.forEach((f, i) => { const k = 1 + Math.sin(t * (9 + i % 5) + i) * 0.08 + Math.sin(t * 23 + i * 3) * 0.05; if (i % 2 === 0) f.scale.set(0.16 * (2 - k), 0.32 * k, 1); else f.material.opacity = 0.45 + Math.sin(t * 3 + i) * 0.1; });
    const cz = G.cp.z;
    const ahead = G.lamps.filter((p) => p.z < cz + 2 && p.z > cz - 22).slice(0, 4);
    G.lights.forEach((L, i) => { const p = ahead[i]; if (p) { L.position.copy(p); L.intensity = 6 + Math.sin(t * 11 + i) * 0.8; } else L.intensity = 0; });
    const B = G.banners;
    if (B.g) { B.g.m.rotation.z = Math.sin(t * 0.9) * 0.03; B.b.m.rotation.z = Math.sin(t * 0.9 + 1.4) * 0.03; B.amp.m.rotation.y = Math.sin(t * 0.6) * 0.35; B.title.m.position.y = 4.2 + Math.sin(t * 0.7) * 0.06; B.date.m.position.y = 7.4 + Math.sin(t * 0.8) * 0.08; B.mono.m.position.y = 2.5 + Math.sin(t) * 0.05; }
    G.thaali.rotation.y = t * 0.5 + S.rel * Math.PI * 4; G.thaali.position.y = 2.35 + Math.sin(t * 1.2) * 0.05;
    G.metti.rotation.y = -t * 0.4 - S.rel * Math.PI * 2; G.metti.position.y = 1.42 + Math.sin(t * 1.4 + 1) * 0.03;
    G.dust.position.y = Math.sin(t * 0.3) * 0.2; G.dust.rotation.y = Math.sin(t * 0.05) * 0.02;
    const pd = G.pd, d = G.dummy, rate = 1 + S.shower * 1.5;
    for (let i = 0; i < pd.length; i++) {
      const p = pd[i];
      p.y -= p.vy * dt * rate; p.sw += dt * p.sr; p.rx += dt * p.sr * 1.3; p.ry += dt * p.sr;
      if (p.y < 0.02 || p.z > cz + 4 || p.z < cz - 34) { p.y = 4 + Math.random() * 4; p.x = G.cp.x + (Math.random() - 0.5) * 12; p.z = cz - 2 - Math.random() * 28; }
      d.position.set(p.x + Math.sin(p.sw) * 0.35, p.y, p.z); d.rotation.set(p.rx, p.ry, 0); d.updateMatrix(); G.petals.setMatrixAt(i, d.matrix);
    }

    G.r.render(G.scene, G.cam);
  }

  // ---------- scroll story ----------
  story(g, ST, R) {

    const K = [
      [0, 1.8, 2.4, 0, 2.0, -12],
      [0, 1.9, -58, 0, 3.4, -90],
      [0, 2.5, -66, 0, 5.6, -96],
      window.innerWidth / window.innerHeight < 0.8 ? [6.9, 2.3, -70.6, 8, 1.35, -74.1] : [4.5, 1.95, -70.4, 8, 2.0, -74.2],
      [-3.9, 2.3, -78.4, -9.6, 2.6, -84.6],

    const secs = ['.s-hero', '.s-walk', '.s-date', '.s-relics', '.s-couple', '.s-venue', '.s-finale'];
    const tl = g.timeline({ scrollTrigger: { trigger: '.story', start: 'top top', end: 'bottom bottom', scrub: 1.1, invalidateOnRefresh: true } });
    let at = 0;
    secs.forEach((sel, i) => {

      if (i === 0) {
        tl.to(S, { px: 0, py: 5.8, pz: 7.2, tx: 0, ty: 1.4, tz: -8, duration: dur * 0.5, ease: 'power1.inOut' }, at)
          .to(S, { px: k[0], py: k[1], pz: k[2], tx: k[3], ty: k[4], tz: k[5], duration: dur * 0.5, ease: 'power1.inOut' }, at + dur * 0.5)
          .to(S, { door: 1, duration: dur * 0.7, ease: 'power1.inOut' }, 0);
      } else tl.to(S, { px: k[0], py: k[1], pz: k[2], tx: k[3], ty: k[4], tz: k[5], duration: i === 3 ? dur * 0.35 : dur, ease: 'power1.inOut' }, at);
      if (i === 3) tl.to(S, { rel: 1, duration: dur, ease: 'none' }, at);
      if (i === 6) tl.to(S, { shower: 1, duration: dur, ease: 'none' }, at);

      .to('.cap3', { opacity: 1, y: 0, duration: 0.1 }, 0.68).to('.cap3', { opacity: 0, y: -30, duration: 0.08 }, 0.92);

  // ---------- scratch reveal ----------
  initScratch(R) {
    const cv = R.querySelector('.scv');
    if (!cv || !cv.getContext) return;
    const box = cv.parentElement, ctx = cv.getContext('2d');
    const paint = () => {
      if (this.state.revealed) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2), w = box.clientWidth, h = box.clientHeight;
      if (!w || !h) return;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'source-over';
      const gr = ctx.createLinearGradient(0, 0, w, h);
      gr.addColorStop(0, '#8A5A1C'); gr.addColorStop(0.25, '#F7E2A8'); gr.addColorStop(0.5, '#C9962E'); gr.addColorStop(0.75, '#FFF1C4'); gr.addColorStop(1, '#9C6A1E');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
      ctx.save(); ctx.translate(w / 2, h / 2); const sc = Math.min(w, h) / 460; ctx.scale(sc, sc);
      ctx.strokeStyle = 'rgba(90,50,10,.35)'; ctx.lineWidth = 2; ctx.stroke(new Path2D(this.kolam().lines)); ctx.restore();
      for (let i = 0; i < 900; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.45).toFixed(2) + ')'; ctx.fillRect(Math.random() * w, Math.random() * h, 1.3, 1.3); }
      ctx.fillStyle = 'rgba(42,8,13,.9)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '44px Kavivanar, serif'; ctx.fillText('உ', w / 2, h / 2 - 30);
      ctx.font = '14px Marcellus, serif'; ctx.fillText('S C R A T C H   T O   R E V E A L', w / 2, h / 2 + 18);
    };
    this._paint = paint; paint();
    let down = false, last = null, moves = 0;
    const pos = (e) => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * (box.clientWidth / b.width), y: (e.clientY - b.top) * (box.clientHeight / b.height) }; };
    const check = () => { const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, tot = 0; for (let i = 3; i < d.length; i += 160) { tot++; if (d[i] < 30) clear++; } if (tot && clear / tot > 0.45) this.revealDate(); };
    const scratch = (p) => {
      this._scratched = true;
      ctx.globalCompositeOperation = 'destination-out'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 46;
      ctx.beginPath(); const a = last || p; ctx.moveTo(a.x, a.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
      last = p; if (++moves % 10 === 0) check();
    };
    cv.addEventListener('pointerdown', (e) => { if (this.state.revealed) return; down = true; last = null; try { cv.setPointerCapture(e.pointerId); } catch (err) {} scratch(pos(e)); });
    cv.addEventListener('pointermove', (e) => { if (down) scratch(pos(e)); });
    const up = () => { down = false; last = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  }

  revealDate() {
    if (this._revealing) return;
    this._revealing = true;
    const g = window.gsap, R = document.querySelector('.inv3');
    const cv = R && R.querySelector('.scv');
    this.setState({ revealed: true });
    if (!cv) return;
    if (!g) { cv.style.display = 'none'; return; }
    g.to(cv, { opacity: 0, scale: 1.06, duration: 0.8, ease: 'power2.out', onComplete: () => { cv.style.pointerEvents = 'none'; cv.style.visibility = 'hidden'; } });
    g.fromTo(R.querySelectorAll('.sc-in > *'), { y: 30, opacity: 0, rotationX: -70 }, { y: 0, opacity: 1, rotationX: 0, stagger: 0.08, duration: 1, ease: 'back.out(1.8)', delay: 0.15 });
    R.querySelectorAll('.burst i').forEach((el, i, all) => {
      const a = (i / all.length) * Math.PI * 2, d = 150 + (i % 4) * 45;
      g.fromTo(el, { x: 0, y: 0, scale: 0.2, opacity: 1, rotation: 0 }, { x: Math.cos(a) * d, y: Math.sin(a) * d * 0.7, scale: 1.3, rotation: 360, opacity: 0, duration: 1.6, ease: 'expo.out' });
    });
    if (this._gl) { const G = this._gl; g.fromTo(G.banners.date.m.scale, { x: 0.6, y: 0.6 }, { x: 1, y: 1, duration: 1.2, ease: 'elastic.out(1, 0.5)', delay: 0.1 }); g.to(G.S, { shower: 1, duration: 0.4, yoyo: true, repeat: 1 }); }
  }

  renderVals() {
    const I = this.info(), p = this.props;

    let cd = { d: '00', h: '00', m: '00', s: '00' };
    if (I.ok) { const t = Math.floor(Math.max(0, I.d.getTime() - this.state.now) / 1000); cd = { d: pad(Math.floor(t / 86400)), h: pad(Math.floor(t / 3600) % 24), m: pad(Math.floor(t / 60) % 60), s: pad(t % 60) }; }
    const venueName = p.venueName ?? '[Venue Name]';
    const shareText = 'You are invited to the wedding reception of ' + I.groom + ' & ' + I.bride + ' on ' + I.dateLong + ', ' + I.time + ' at ' + venueName + '.';
    const colors = ['#F29A07', '#FFC94A', '#C4252F', '#FFFDF4', '#E0601A'];
    return {
      groom: I.groom, bride: I.bride, groomTa: I.groomTa, brideTa: I.brideTa,
      weekday: I.weekday, day: I.day, monthYear: I.monthYear, dateLong: I.dateLong, taDate: I.taDate, time: I.time, cd,
      couplePhoto: (p.couplePhoto ?? 'assets/couple.jpg') || 'assets/couple.jpg',
      venueName, venueAddress: p.venueAddress ?? '[Street, Area, City]',
      mapLink: p.mapLink ?? 'https://maps.google.com',
      share: 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + (typeof location !== 'undefined' && /^https?:/.test(location.href) ? location.href.split('#')[0] : '')),
      hashtag: p.hashtag ?? '#YourWeddingHashtag',
      burst: Array.from({ length: 16 }, (_, i) => ({ c: colors[i % colors.length] })),
      notRevealed: !this.state.revealed,
      revealNow: () => this.revealDate()
    };
  }
}

<!-- Background music: assets/music.mp3. The button shows once the file is known playable; no fetch() probe, since a sandboxed iframe's opaque origin would make that a cross-origin request. -->
<audio id="bgm" src="assets/music.mp3" loop preload="auto"></audio>
<button id="musicBtn" type="button" aria-label="Music on/off" style="display:none;position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(66px + env(safe-area-inset-top));z-index:9999;width:42px;height:42px;border-radius:50%;border:1px solid #E3B75C;background:rgba(13,4,6,.75);color:#F8EEDC;font-size:18px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent">&#128263;</button>
<script>
(function () {
  var a = document.getElementById('bgm'), b = document.getElementById('musicBtn');
  var started = false, userMuted = false;
  a.addEventListener('loadedmetadata', function () { b.style.display = 'block'; });
  a.addEventListener('error', function () { b.style.display = 'none'; });
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (e) {
    document.addEventListener(e, start, { passive: true });
  });
  function fadeIn() {
    a.volume = 0;
    var t = setInterval(function () { a.volume = Math.min(0.6, a.volume + 0.05); if (a.volume >= 0.6) clearInterval(t); }, 120);
  }
  function play() {
    started = true; fadeIn();
    return a.play().catch(function (e) { started = false; throw e; });
  }
  function start(ev) {
    if (started || userMuted || (ev && ev.target === b)) return;
    play().catch(function () {});
  }
  a.addEventListener('playing', function () { b.innerHTML = '&#128266;'; });
  a.addEventListener('pause', function () { b.innerHTML = '&#128263;'; });
  b.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (a.paused) { userMuted = false; play().catch(function () {}); }
    else { userMuted = true; a.pause(); }
  });
  var gate = document.getElementById('gate');
  function openGate(ev) {
    if (ev) ev.preventDefault();
    if (!started && !userMuted) play().catch(function () {});
    gate.classList.add('gone');
  }
  gate.addEventListener('click', openGate);
  gate.addEventListener('wheel', function (ev) { ev.preventDefault(); }, { passive: false });
  gate.addEventListener('touchmove', function (ev) { ev.preventDefault(); }, { passive: false });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) a.pause();
    else if (started && !userMuted) a.play().catch(function () {});
  });
})();
</script>
