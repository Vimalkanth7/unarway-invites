<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ — Invitation</title>
<!--
  No og/twitter meta here: this document only ever runs inside a sandboxed
  preview iframe or gets packaged into the paid download. The public share
  page is /i/<short-id>, which owns its own social meta tags.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%278%27 fill=%27none%27 stroke=%27%23B98A5E%27 stroke-width=%272%27/%3E%3C/svg%3E">
<style>
/* ---------- EDIT-ME: theme tokens -- pick this design's own palette before anything else ---------- */
:root{
  --ivory:#FAF7F2;--cream:#F0E8DC;--ink:#2B241C;
  --accent:#B98A5E;--accent-hi:#E7C9A3;--accent-dk:#7A5636;--night:#1C1711;
  --slate:#3A4A52;--rose:#7A3F4D;
}
/* EDIT-ME: one background gradient per beat -- replace with real photography
   (a .bgw <img> the same way christian-garden's template does it) once this
   design has art. Kept as gradients here so the stub ships zero image
   assets and nothing to license. */
:root{
  --grad-0:radial-gradient(120% 90% at 50% 10%,var(--cream) 0%,var(--ivory) 60%,#E3DCCB 100%);
  --grad-1:linear-gradient(160deg,var(--night) 0%,#2A2117 60%,var(--accent-dk) 130%);
  --grad-2:radial-gradient(90% 70% at 50% 20%,var(--accent-hi) 0%,var(--cream) 65%,var(--ivory) 100%);
  --grad-3:radial-gradient(90% 60% at 50% 25%,#FFFCF4 0%,var(--cream) 70%,#EDE2CC 100%);
  --grad-4:linear-gradient(150deg,var(--accent-dk) 0%,var(--night) 100%);
  --grad-5:radial-gradient(100% 80% at 50% 0%,var(--ivory) 0%,var(--cream) 100%);
  --grad-6:linear-gradient(160deg,#2A2117 0%,var(--night) 100%);
}

*{box-sizing:border-box}
html{background:#E9E0CF;font-variant-numeric:lining-nums}
body{margin:0;min-height:100svh;font-family:Manrope,'Segoe UI',sans-serif;color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased}
a{color:inherit}
ul{list-style:none;margin:0;padding:0}
.lab{font-family:Manrope,sans-serif;font-weight:500;font-size:3.1cqw;letter-spacing:.32em;text-transform:uppercase;margin:0}

/* ---------- frame ---------- */
.story{position:relative}
.stage{position:relative;width:100%}
.frame{position:relative;width:min(100vw,calc(100svh * .6));margin:0 auto;overflow:hidden;container-type:inline-size;background:var(--night)}
@media (min-aspect-ratio:4/5){.frame{box-shadow:0 30px 90px rgba(40,30,15,.35),0 0 0 1px rgba(185,138,94,.35)}}

.scene{position:relative;min-height:177cqw;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:6cqw;padding:10cqw 0}
.bgw{position:absolute;inset:-2%;will-change:transform,opacity}
.copy{position:relative;text-align:center;padding:0 7cqw;display:flex;flex-direction:column;align-items:center}
.panel,.card{position:relative}
.cuew{display:none}

.anim .frame{height:100svh}
.anim .scene{position:absolute;inset:0;min-height:0;padding:0;display:block}
.anim .scene:not(.sc0){will-change:clip-path}
.anim .copy{position:absolute;left:0;right:0}
.anim .panel,.anim .card{position:absolute}
.anim .cuew{display:flex}

/* ---------- 0 · opening ---------- */
.sc0{background:var(--grad-0);color:var(--slate)}
.sc0 .copy{top:8%;gap:2.4cqw}
.sc0 .lab{color:var(--accent-dk);font-weight:600}
.names{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.names .nm{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:14cqw;color:var(--slate)}
.names .amp{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:7cqw;color:var(--accent-dk);margin:-0.5cqw 0}
.sc0 .sub{margin:2cqw 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:5cqw;color:var(--slate)}
.sc0 .sub small{display:block;margin-top:1.6cqw;font:600 3.7cqw/1.3 Manrope,sans-serif;font-style:normal;letter-spacing:.08em;color:var(--slate)}
.cuew{position:absolute;left:0;right:0;bottom:4.5%;justify-content:center;pointer-events:none}
.cue{pointer-events:auto;display:flex;align-items:center;gap:2.4cqw;padding:2.6cqw 5.4cqw 2.6cqw 6cqw;border-radius:99px;border:1px solid rgba(185,138,94,.8);background:rgba(255,255,255,.94);color:var(--slate);box-shadow:0 10px 28px rgba(40,30,15,.22);font:600 3.9cqw/1.1 Manrope,sans-serif;letter-spacing:.04em;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:44px}
.cue svg{width:5cqw;height:5cqw;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-.6cqw)}50%{transform:translateY(1cqw)}}

/* ---------- 1 · together ---------- */
.sc1{background:var(--grad-1);color:var(--ivory)}
.sc1 .copy{top:12%;gap:3cqw}
.sc1 q{quotes:none;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:7.4cqw;line-height:1.2;color:var(--ivory)}
.sc1 q::before{content:'\201C'}.sc1 q::after{content:'\201D'}
.sc1 .lab{color:var(--accent-hi);font-weight:600}
.sc1 .names2{margin:1.4cqw 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:10cqw;color:#fff}
.sc1 .names2 i{font-size:.55em;color:var(--accent-hi);padding:0 .25em;font-style:normal}
.sc1 .venue-line{margin:1cqw 0 0;font:500 3.3cqw/1.4 Manrope,sans-serif;letter-spacing:.08em;color:var(--accent-hi)}

/* ---------- 2 · date & countdown ---------- */
.sc2{background:var(--grad-2);color:var(--ink)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.92));border:1px solid rgba(185,138,94,.5);border-radius:6cqw;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(40,30,15,.18)}
.sc2 .card{top:50%;transform:translateY(-50%);left:6cqw;right:6cqw;padding:7cqw 5cqw 6cqw;gap:2.2cqw;text-align:center;display:flex;flex-direction:column;align-items:center}
.sc2 .card .lab{color:var(--accent-dk);font-weight:600}
.dateline{display:flex;align-items:flex-end;justify-content:center;gap:4cqw;line-height:1}
.dateline .wd,.dateline .my{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:6.6cqw;padding-bottom:3cqw}
.dateline .dd{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27cqw;line-height:.82;color:var(--accent-dk)}
.sc2 .tm{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:5.6cqw}
.cd{display:flex;gap:2.4cqw;justify-content:center;margin-top:2cqw}
.cd div{min-width:15cqw;padding:2.4cqw 1cqw 2cqw;border-radius:3cqw;border:1px solid rgba(185,138,94,.5);background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:1cqw}
.cd b{font-family:Manrope,sans-serif;font-weight:500;font-size:6.6cqw;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.cd span{font-size:2.3cqw;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-dk)}
.done{margin:1.2cqw 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:4.8cqw;color:var(--accent-dk)}

/* ---------- 3 · schedule ---------- */
.sc3{background:var(--grad-3);color:var(--ink)}
.sched{position:relative;display:flex;flex-direction:column;gap:3cqw;padding:0 5cqw;top:14%}
.anim .sched{position:absolute;left:0;right:0;top:auto;bottom:4%}
.sched .hd{text-align:center;color:var(--accent-dk);font-weight:600;margin-bottom:.5cqw}
.ev{display:grid;grid-template-columns:19cqw 1fr 11.5cqw;gap:3.4cqw;align-items:center;padding:3.4cqw 3.6cqw 3.4cqw 2.6cqw;border-radius:4.4cqw;background:rgba(255,255,255,.78);border:1px solid rgba(185,138,94,.5);box-shadow:0 8px 24px rgba(60,45,20,.12)}
.ev .dt{text-align:center;border-right:1px solid rgba(185,138,94,.5);padding-right:2.4cqw}
.ev .dt b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:11.5cqw;line-height:.95;color:var(--accent-dk)}
.ev .dt span{display:block;margin-top:1cqw;font:600 2.9cqw/1 Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-dk)}
.ev .nm2{margin:0;font:600 2.8cqw/1.1 Manrope,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-dk)}
.ev .tm3{margin:1.2cqw 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:5.6cqw;line-height:1.1}
.ev .vn{margin:1.2cqw 0 0;font:500 3.7cqw/1.3 Manrope,sans-serif;color:#54483A}
.ev .go,button.go{display:flex;align-items:center;justify-content:center;width:11.5cqw;height:11.5cqw;border-radius:50%;border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-dk));color:var(--ink);box-shadow:0 6px 16px rgba(60,45,20,.25);-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none;padding:0}
.ev .go svg{width:5.4cqw;height:5.4cqw}

/* ---------- 4 · venue ---------- */
.sc4{background:var(--grad-4);color:var(--ivory)}
.sc4 .card{top:50%;transform:translateY(-50%);left:6cqw;right:6cqw;padding:8cqw 6cqw;gap:3cqw;text-align:center;display:flex;flex-direction:column;align-items:center}
.sc4 .lab{color:var(--accent-hi);font-weight:600}
.sc4 .venue-name{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:8cqw;color:#fff}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:2cqw;min-height:44px;padding:0 7cqw;border-radius:99px;border:1px solid var(--accent);font-family:Manrope,sans-serif;font-weight:600;font-size:3.1cqw;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-dk));box-shadow:0 8px 24px rgba(60,45,20,.25);cursor:pointer;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none}

/* ---------- 5 · wishes ---------- */
.sc5{background:var(--grad-5);color:var(--ink)}
.sc5 .panel{top:50%;transform:translateY(-50%);left:4.5cqw;right:4.5cqw;padding:6cqw 5cqw;border-radius:6cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3cqw;background:rgba(255,255,255,.75);border:1px solid rgba(185,138,94,.5)}
.panel h3{margin:0 0 1.6cqw;font-family:Manrope,sans-serif;font-weight:600;font-size:2.6cqw;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-dk)}
.wishes{width:100%}
.wishes li{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:4.4cqw;line-height:1.3}
.wishes li span{font-family:Manrope,sans-serif;font-weight:500;font-size:2.6cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dk);margin-right:1.6cqw}

/* ---------- 6 · contacts & share ---------- */
.sc6{background:var(--grad-6);color:var(--ivory)}
.sc6 .panel{top:50%;transform:translateY(-50%);left:4.5cqw;right:4.5cqw;padding:6cqw 5cqw;border-radius:6cqw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3cqw;background:rgba(0,0,0,.35);border:1px solid rgba(185,138,94,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sc6 .tag{margin:0;font-family:Manrope,sans-serif;font-weight:600;font-size:3.4cqw;letter-spacing:.05em;color:var(--accent-hi);word-break:break-word}
.contacts-card{width:100%}
.contacts-card ul{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;width:100%}
.contacts-card a{display:block;text-decoration:none;padding:2cqw 1cqw;border-radius:3cqw;background:rgba(255,255,255,.08);border:1px solid rgba(185,138,94,.5)}
.contacts-card a span{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:4.6cqw;line-height:1.1;color:#fff}
.contacts-card a b{display:block;font-family:Manrope,sans-serif;font-weight:500;font-size:3.6cqw;letter-spacing:.05em;color:var(--accent-hi);margin-top:.6cqw;font-variant-numeric:lining-nums tabular-nums}

q{text-wrap:balance}
/* ---------- chrome ---------- */
.prog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent-hi));z-index:80;display:none}
.anim .prog{display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none;opacity:.85}
.anim #fx{display:block}
#musicBtn{display:none;position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));z-index:9999;width:46px;height:46px;border-radius:50%;border:1px solid var(--accent);background:rgba(250,247,242,.9);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px)}

/* gate */
#gate{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2svh;padding:24px;text-align:center;background:radial-gradient(120% 80% at 50% 25%,#FFFDF9 0%,var(--cream) 60%,#E3D6BC 100%);color:var(--ink);transition:opacity .9s ease,visibility .9s;-webkit-tap-highlight-color:transparent}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
#gate .g-lab{font:600 12px/1 Manrope,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--accent-dk)}
#gate .g-photo{width:min(190px,44vw);aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;box-shadow:0 0 0 2px var(--accent),0 0 0 8px rgba(250,247,242,.9),0 0 0 9px rgba(185,138,94,.5),0 24px 50px rgba(50,35,10,.28);margin:4px 0}
#gate .g-photo img{width:100%;height:100%;object-fit:cover;display:block;animation:gz 9s ease-in-out infinite alternate}
@keyframes gz{from{transform:scale(1)}to{transform:scale(1.1)}}
#gate .g-names{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--slate)}
#gate .g-names i{font-style:normal;color:var(--accent-dk);padding:0 .3em}
#gate .g-date{font:500 15px/1.4 Manrope,sans-serif;color:#54483A;letter-spacing:.08em}
/* EDIT-ME: this is the real, keyboard/screen-reader-accessible gate
   trigger -- only this button opens the gate, not a click handler on the
   whole #gate div, so the control has correct semantics and a guest using
   a screen reader or keyboard lands on something that announces itself as
   a button, not a div pretending to be one. */
#gate .g-btn{margin-top:8px;min-height:54px;padding:0 34px;border-radius:999px;border:1px solid var(--accent);font:600 14px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-dk));cursor:pointer;animation:gpulse 2.2s ease-in-out infinite}
#gate .g-hint{font:500 12px/1 Manrope,sans-serif;color:#7A6C58}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(185,138,94,.5)}50%{box-shadow:0 0 0 14px rgba(185,138,94,0)}}
@media (prefers-reduced-motion:reduce){#gate .g-photo img,#gate .g-btn,.cue svg{animation:none}}
</style>
<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/ScrollTrigger.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="prog" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="story">
<div class="stage">
<div class="frame">

<!-- 0 · Opening -->
<section class="scene sc0" id="s0" aria-label="Opening">
  <div class="bgw"></div>
  <div class="copy">
    <p class="lab rv">You're Invited</p>
    <h1 class="names rv"><span class="nm">{{person1}}</span><span class="amp">&amp;</span><span class="nm">{{person2}}</span></h1>
    <p class="sub rv">{{ceremonyDay}}<small>{{ceremonyVenue}}</small></p>
  </div>
  <div class="cuew"><button class="cue rv" type="button" id="cue" aria-label="Scroll to continue"><span>Please scroll the screen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
</section>

<!-- 1 · Together -->
<section class="scene sc1" id="s1" aria-label="Invitation">
  <div class="bgw"></div>
  <div class="copy">
    <!-- EDIT-ME: replace with this design's own line (a verse, a poem, a
         short vow line) -- this is a generic placeholder, not scripture. -->
    <q class="rv">Two hearts, one beginning.</q>
    <p class="names2 rv"><span>{{person1}}</span><i>&amp;</i><span>{{person2}}</span></p>
    <p class="venue-line rv">{{ceremonyDay}} &middot; {{ceremonyVenue}}</p>
  </div>
</section>

<!-- 2 · Date & countdown -->
<section class="scene sc2" id="s2" aria-label="The date">
  <div class="bgw"></div>
  <div class="card glass rb" aria-label="Date of the ceremony">
    <p class="lab">Save the date</p>
    <div class="dateline"><span class="wd">{{weekday}}</span><span class="dd">{{day}}</span><span class="my">{{monthYear}}</span></div>
    <p class="tm">At {{time}}</p>
    <sc-if value="{{notPast}}">
      <div class="cd" aria-label="Countdown">
        <div><b>{{cd.d}}</b><span>Days</span></div>
        <div><b>{{cd.h}}</b><span>Hours</span></div>
        <div><b>{{cd.m}}</b><span>Min</span></div>
        <div><b>{{cd.s}}</b><span>Sec</span></div>
      </div>
    </sc-if>
    <sc-if value="{{isPast}}">
      <p class="done">The celebration has taken place.</p>
    </sc-if>
  </div>
</section>

<!-- 3 · Schedule -->
<section class="scene sc3" id="s3" aria-label="Schedule of events">
  <div class="bgw"></div>
  <div class="sched" data-events>
    <p class="lab hd rv">The Celebrations</p>
  </div>
</section>

<!-- 4 · Venue -->
<section class="scene sc4" id="s4" aria-label="Venue">
  <div class="bgw"></div>
  <div class="card rb">
    <p class="lab">Join us at</p>
    <p class="venue-name">{{ceremonyVenue}}</p>
    <button class="btn btn-directions" type="button">Directions</button>
  </div>
</section>

<!-- 5 · Wishes -->
<section class="scene sc5" id="s5" aria-label="Wishes">
  <div class="bgw"></div>
  <div class="panel rb">
    <div class="wishes"><h3>Best wishes from</h3><ul></ul></div>
  </div>
</section>

<!-- 6 · Contacts & share -->
<section class="scene sc6" id="s6" aria-label="Contacts">
  <div class="bgw"></div>
  <div class="panel rb">
    <p class="tag">{{hashtag}}</p>
    <div class="contacts-card"><ul></ul></div>
    <button class="btn btn-share" type="button">Share on WhatsApp</button>
  </div>
</section>

</div>
</div>
</main>

</template>
<!--
  Seed values only, matching defaults.json: lets this file render something
  sensible if opened directly (outside the parent app). The parent always
  overwrites these via the unarway:config postMessage immediately after
  this document signals unarway:ready - see the runtime script below.
-->
<script id="inv-config" type="application/json">{"person1Name":"__TITLE__","person2Name":"Partner","coverPhoto":"","ceremonyDate":"2027-11-15T10:30","ceremonyVenue":"Venue Name","ceremonyMap":"","events":"[]","wishes":"[]","contacts":"[]","hashtag":""}</script>
<script>/* Tiny template runtime: renders the <template id="tpl"> with the Component class.
   This engine (interpolation, sc-for/sc-if, DCLogic, postMessage contract) is
   reused verbatim from templates/christian-garden -- it's the shared, proven
   contract every design runs on, not something to reinvent per design. */
(function () {
  // No localStorage/cookies: this document runs in a sandbox="allow-scripts"

    if (this._beatST) this._beatST.kill();
    this.buildTimeline();
    ST.refresh();
    try {
      if (this._beatST && typeof this._beatST.labelToScroll === 'function') {
        window.scrollTo(0, this._beatST.labelToScroll('b' + beat));
      }
    } catch (e) {}
  }
}

window.__mountInvite(Component);</script>

<!-- Welcome gate: the guest's tap on the button is what lets the phone start the music -->
<div id="gate" role="dialog" aria-label="Open the invitation">
  <span class="g-lab">You're Invited</span>
  <div class="g-photo"><img src="assets/cover-placeholder.svg" alt=""></div>
  <div class="g-names"></div>
  <div class="g-date"></div>
  <button class="g-btn" type="button" id="gate-open">Open Invitation</button>
  <span class="g-hint">&#127925; with music</span>
</div>
<button id="musicBtn" type="button" aria-label="Music on/off">&#128263;</button>
<audio id="bgm" src="assets/music.mp3" loop preload="auto"></audio>
<script>
(function () {
  var a = document.getElementById('bgm'), b = document.getElementById('musicBtn');
  var started = false, userMuted = false;
  // No HEAD-request existence probe: fetch() is blocked by the sandboxed
  // iframe's connect-src 'none' CSP anyway, and once this design has a real
  // assets/music.mp3 the button should just work. Until then, tapping it
  // simply fails silently (no audio file yet) -- not an error state.
  b.style.display = 'block';
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (e) { document.addEventListener(e, start, { passive: true }); });
  function fadeIn() {
    a.volume = 0;
    var t = setInterval(function () { a.volume = Math.min(0.6, a.volume + 0.05); if (a.volume >= 0.6) clearInterval(t); }, 120);
  }
  function play() { started = true; fadeIn(); return a.play().catch(function (e) { started = false; throw e; }); }
  function start(ev) { if (started || userMuted || (ev && ev.target === b)) return; play().catch(function () {}); }
  a.addEventListener('playing', function () { b.innerHTML = '&#128266;'; });
  a.addEventListener('pause', function () { b.innerHTML = '&#128263;'; });
  b.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (a.paused) { userMuted = false; play().catch(function () {}); } else { userMuted = true; a.pause(); }
  });
  var gate = document.getElementById('gate');
  var openBtn = document.getElementById('gate-open');
  function openGate(ev) {
    if (ev) ev.preventDefault();
    if (!started && !userMuted) play().catch(function () {});
    gate.classList.add('gone');
    if (window.__intro) window.__intro();
  }
  // Only the real <button> opens the gate -- not a click handler on the
  // whole #gate div -- so the control has correct accessibility semantics.
  openBtn.addEventListener('click', openGate);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) a.pause(); else if (started && !userMuted) a.play().catch(function () {});
  });
})();
</script>
